name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validate:
    name: Backend (Ruff, MyPy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and check PEP 8 formatting with Ruff
        run: |
          ruff check app scripts tests alembic ../api
          ruff format --check app scripts tests alembic ../api

      - name: Typecheck with MyPy
        run: mypy app scripts tests ../api

      - name: Run Pytest suite
        run: pytest

  e2e-journey-validate:
    name: Full-Stack 13-Step Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-validate, frontend-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend, migrate SQLite DB, and seed reference data
        working-directory: backend
        env:
          APP_ENV: development
          DATABASE_URL: sqlite+aiosqlite:///./e2e_ci.sqlite3
          AIR_QUALITY_PROVIDER: fixture
          WEATHER_PROVIDER: fixture
          AUTH_SECRET_KEY: ci-only-cryptographic-random-secret-key-at-least-32-bytes
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          alembic upgrade head
          python -m scripts.seed_reference_data

      - name: Install frontend, build Next.js, and install Chromium
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_NAME: AirWise AI
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_DEFAULT_AQI_STANDARD: india_naqi
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Run 13-Step Playwright User Journey against live stack
        env:
          APP_ENV: development
          DATABASE_URL: sqlite+aiosqlite:///./e2e_ci.sqlite3
          REDIS_URL: ""
          AIR_QUALITY_PROVIDER: fixture
          WEATHER_PROVIDER: fixture
          AUTH_SECRET_KEY: ci-only-cryptographic-random-secret-key-at-least-32-bytes
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          (cd frontend && npm run start) &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          cd frontend && npx playwright test --project=chromium

  frontend-validate:
    name: Frontend (Lint, TypeScript, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Typecheck strict TypeScript
        run: npm run typecheck

      - name: Run Vitest unit & UI tests
        run: npm run test

      - name: Build production Next.js bundle
        env:
          NEXT_PUBLIC_APP_NAME: AirWise AI
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_DEFAULT_AQI_STANDARD: india_naqi
        run: npm run build

  docker-build-check:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-validate, frontend-validate, e2e-journey-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend container image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
