name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validate:
    name: Backend (Ruff, MyPy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app scripts

      - name: Typecheck with MyPy
        run: mypy app

      - name: Run Pytest suite
        run: pytest

  frontend-validate:
    name: Frontend (Lint, TypeScript, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run lint

      - name: Typecheck strict TypeScript
        run: npm run typecheck

      - name: Run Vitest unit & UI tests
        run: npm run test

      - name: Build production Next.js bundle
        env:
          NEXT_PUBLIC_APP_NAME: AirWise AI
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_DEFAULT_AQI_STANDARD: india_naqi
        run: npm run build

  docker-build-check:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-validate, frontend-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend container image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
