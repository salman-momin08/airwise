[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airwise-backend"
version = "0.1.0"
description = "AirWise AI — GenAI-Powered Smog & Air Pollution Lifestyle Assistant Backend"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "geoalchemy2>=0.16.0,<1.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "redis>=5.2.0,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "httpx>=0.28.0,<1.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "openai>=1.55.0,<2.0.0",
    "structlog>=24.4.0,<26.0.0",
    "prometheus-client>=0.21.0,<1.0.0",
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false
