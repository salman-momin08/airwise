name: airwise-ai

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airwise_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-airwise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airwise} -d $${POSTGRES_DB:-airwise}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-airwise}:${POSTGRES_PASSWORD:-airwise_dev_only}@postgres:5432/${POSTGRES_DB:-airwise}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - ./.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-airwise}:${POSTGRES_PASSWORD:-airwise_dev_only}@postgres:5432/${POSTGRES_DB:-airwise}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    env_file:
      - ./.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-airwise}:${POSTGRES_PASSWORD:-airwise_dev_only}@postgres:5432/${POSTGRES_DB:-airwise}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.example
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge

networks:
  internal:
    internal: true
  edge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
